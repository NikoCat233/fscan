name: poc-yaml-wordpress-debug-log
rules:
  - method: GET
    path: /wp-content/debug.log
    expression: |
      response.status == 200 && (response.content_type.icontains("text/plain") || response.content_type.icontains("octet-stream")) && response.body.bcontains(b"PHP") && "\\[[0-9]{2}-[A-Za-z]{3}-[0-9]{4} [0-9]{2}:[0-9]{2}:[0-9]{2} [A-Z]{3}\\] PHP".bmatches(response.body)
detail:
  author: adysec/nuclei_poc
  description: WordPress debug.log is publicly accessible
  links:
    - https://github.com/adysec/nuclei_poc
