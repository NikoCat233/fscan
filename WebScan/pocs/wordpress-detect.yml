name: poc-yaml-wordpress-detect
groups:
  root-markers:
    - method: GET
      path: /
      follow_redirects: true
      expression: |
        response.status == 200 && (response.body.bcontains(b"/wp-content/") || response.body.bcontains(b"/wp-includes/") || response.body.bcontains(b"wp-login.php") || response.body.bcontains(b"content=\"WordPress"))
  feed-generator:
    - method: GET
      path: /feed/
      follow_redirects: true
      expression: |
        response.status == 200 && response.body.bcontains(b"<generator>") && response.body.bcontains(b"wordpress.org")
  install-page:
    - method: GET
      path: /wp-admin/install.php
      follow_redirects: true
      expression: |
        response.status == 200 && (response.body.bcontains(b"WordPress") && (response.body.bcontains(b"install.php") || response.body.bcontains(b"setup-config.php")))
detail:
  author: adysec/nuclei_poc
  description: WordPress technology fingerprint detection
  links:
    - https://github.com/adysec/nuclei_poc
